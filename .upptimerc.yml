status-website:
  cname: status.goose.cc.cd
  name: Goose 服务状态
  introTitle: "**Goose 服务状态**"
  introMessage: 这是基于 Upptime 的实时状态页，数据来自 GitHub Actions、Issues 和 Pages。
  navbar:
    - title: 状态
      href: /
    - title: GitHub
      href: https://github.com/Minecraftgoose/status

# 提交信息汉化（[skip ci] 标记必须保留，否则会触发工作流死循环）
commitMessages:
  readmeContent: ":pencil: 更新 README 状态概览 [skip ci] [upptime]"
  summaryJson: ":card_file_box: 更新状态摘要 [skip ci] [upptime]"
  statusChange: "$EMOJI $SITE_NAME 当前状态：$STATUS（响应码 $RESPONSE_CODE，耗时 $RESPONSE_TIME ms）[skip ci] [upptime]"
  graphsUpdate: ":bento: 更新响应时间图表 [skip ci] [upptime]"
  commitAuthorName: "Upptime Bot"
  commitAuthorEmail: "upptime@koj.co"

# 界面汉化：状态页 + README 共用同一套 i18n 键
i18n:
  # ===== 顶部状态与事件 =====
  liveStatus: 实时状态
  liveStatusHtmlComment: ""
  allSystemsOperational: 所有系统运行正常
  degradedPerformance: 性能下降
  partialOutage: 部分服务中断
  completeOutage: 全部服务中断
  activeIncidents: 进行中的事件
  pastIncidents: 历史事件
  scheduledMaintenance: 计划维护
  pastScheduledMaintenance: 历史计划维护

  # ===== 事件详情 =====
  incidentReport: "事件 #$NUMBER 报告 →"
  activeIncidentSummary: 于 $DATE 发生，共 $POSTS 条动态
  incidentTitle: 事件 $NUMBER 详情
  incidentDetails: 事件详情
  incidentFixed: 已修复
  incidentOngoing: 处理中
  incidentCompleted: 已完成
  incidentScheduled: 已计划
  incidentOpenedAt: 发生时间
  incidentClosedAt: 解决时间
  incidentViewOnGitHub: 在 GitHub 上查看并订阅
  incidentCommentSummary: 由 $AUTHOR 发布于 $DATE
  incidentBack: ← 返回全部事件
  pastIncidentsResolved: 已解决，耗时 $MINUTES 分钟，共 $POSTS 条记录

  # ===== 计划维护 =====
  scheduledMaintenanceSummaryStarted: 已于 $DATE 开始，预计持续 $DURATION 分钟
  scheduledMaintenanceSummaryStarts: 将于 $DATE 开始，预计持续 $DURATION 分钟
  startedAt: 开始时间
  startsAt: 预计开始时间
  duration: 持续时间
  durationMin: $DURATION 分钟

  # ===== 指标卡片 =====
  overallUptime: "整体可用率：$UPTIME"
  overallUptimeTitle: 整体可用率
  averageResponseTime: "平均响应：$TIMEms"
  averageResponseTimeTitle: 平均响应
  sevelDayResponseTime: 7 天响应趋势
  responseTimeMs: 响应时间（ms）
  ms: ms

  # ===== 状态文案（状态页与 README 共用）=====
  up: 正常
  down: 中断
  degraded: 降级
  loading: 加载中

  # ===== 时间范围 =====
  duration24H: 24 小时
  duration7D: 7 天
  duration30D: 30 天
  duration1Y: 1 年
  durationAll: 全部

  # ===== README 表格与徽章 =====
  url: 站点
  icon: https://icons.duckduckgo.com/ip3/None.ico
  status: 状态
  history: 历史
  responseTime: 响应时间
  responseTimeGraphAlt: 响应时间趋势图
  responseTimeDay: 24 小时响应时间
  responseTimeWeek: 7 天响应时间
  responseTimeMonth: 30 天响应时间
  responseTimeYear: 1 年响应时间
  uptime: 可用率
  uptimeDay: 24 小时可用率
  uptimeWeek: 7 天可用率
  uptimeMonth: 30 天可用率
  uptimeYear: 1 年可用率

  # ===== 导航与页脚 =====
  navGitHub: GitHub
  footer: 本页面为[开源项目]($REPO)，由 [Upptime](https://upptime.js.org) 提供支持

  # ===== 限流提示 =====
  rateLimitExceededTitle: 请求次数超限
  rateLimitExceededIntro: 你已超出每小时允许的请求次数，需要等待一段时间后才能再次访问本站。你也可以添加 GitHub 个人访问令牌（PAT）继续使用。
  rateLimitExceededWhatDoesErrorMean: 这个错误是什么意思？
  rateLimitExceededErrorMeaning: 本站通过 GitHub API 获取服务状态的实时数据。默认情况下，GitHub 允许每个 IP 每小时 60 次请求，你已用完。
  rateLimitExceededErrorHowCanFix: 我该如何解决？
  rateLimitExceededErrorFix: 你可以等待一小时，该 IP 的限额会自动恢复；或者添加自己的 GitHub 个人访问令牌，可额外获得每小时 5000 次请求额度。
  rateLimitExceededGeneratePAT: 了解如何生成个人访问令牌
  rateLimitExceededHasSet: 你已设置个人访问令牌。
  rateLimitExceededRemoveToken: 移除令牌
  rateLimitExceededGitHubPAT: GitHub 个人访问令牌
  rateLimitExceededCopyPastePAT: 复制并粘贴你的令牌
  rateLimitExceededSaveToken: 保存令牌

  # ===== 错误提示 =====
  errorTitle: 发生错误
  errorIntro: 获取最新状态详情时出现错误。
  errorText: 你可以稍后重试。
  errorHome: 返回首页

  # ===== 日期格式 =====
  locale: zh-CN
